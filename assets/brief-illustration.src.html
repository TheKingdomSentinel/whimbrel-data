<!doctype html>
<meta charset="utf-8">
<style>body{margin:0;background:transparent;width:1240px;height:900px;overflow:hidden}</style>
<body>
<svg width="1240" height="900" viewBox="0 0 620 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#142522" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- page two, behind, slightly rotated -->
  <g transform="rotate(-4 310 225)">
    <rect x="150" y="40" width="320" height="392" rx="10" fill="#f6f5f0" stroke="#d9ddd6" filter="url(#sh)"/>
  </g>

  <!-- page one -->
  <g filter="url(#sh)">
    <rect x="170" y="22" width="320" height="404" rx="10" fill="#ffffff" stroke="#d9ddd6"/>
  </g>

  <!-- kicker -->
  <text x="196" y="56" font-size="9" letter-spacing="1.6" fill="#175e55" font-weight="700">WHIMBREL RESEARCH · ACCOUNT BRIEF</text>

  <!-- company name: redacted -->
  <rect x="196" y="68" width="196" height="16" rx="4" fill="#142522"/>
  <rect x="196" y="90" width="120" height="8" rx="3" fill="#d9ddd6"/>

  <!-- metric chips -->
  <g>
    <rect x="196" y="112" width="86" height="34" rx="7" fill="#e7f0ec"/>
    <text x="204" y="126" font-size="7" letter-spacing="1" fill="#175e55" font-weight="700">FUNDING</text>
    <rect x="204" y="132" width="52" height="7" rx="2.5" fill="#175e55" opacity="0.75"/>

    <rect x="290" y="112" width="86" height="34" rx="7" fill="#e7f0ec"/>
    <text x="298" y="126" font-size="7" letter-spacing="1" fill="#175e55" font-weight="700">STAGE</text>
    <rect x="298" y="132" width="44" height="7" rx="2.5" fill="#175e55" opacity="0.75"/>

    <rect x="384" y="112" width="86" height="34" rx="7" fill="#e7f0ec"/>
    <text x="392" y="126" font-size="7" letter-spacing="1" fill="#175e55" font-weight="700">REGULATORY</text>
    <rect x="392" y="132" width="58" height="7" rx="2.5" fill="#175e55" opacity="0.75"/>
  </g>

  <!-- PROGRAM section -->
  <text x="196" y="172" font-size="8" letter-spacing="1.4" fill="#5f6d68" font-weight="700">PROGRAM</text>
  <rect x="196" y="180" width="274" height="7" rx="2.5" fill="#e3e1da"/>
  <rect x="196" y="192" width="274" height="7" rx="2.5" fill="#e3e1da"/>
  <rect x="196" y="204" width="188" height="7" rx="2.5" fill="#e3e1da"/>
  <!-- source link -->
  <rect x="196" y="217" width="64" height="6" rx="2" fill="#175e55" opacity="0.45"/>

  <!-- DEVELOPMENT RECORD section -->
  <text x="196" y="248" font-size="8" letter-spacing="1.4" fill="#5f6d68" font-weight="700">DEVELOPMENT RECORD</text>
  <g>
    <rect x="196" y="256" width="40" height="7" rx="2.5" fill="#c9cfc9"/>
    <rect x="244" y="256" width="180" height="7" rx="2.5" fill="#e3e1da"/>
    <rect x="432" y="256" width="38" height="7" rx="2.5" fill="#175e55" opacity="0.45"/>

    <rect x="196" y="269" width="40" height="7" rx="2.5" fill="#c9cfc9"/>
    <rect x="244" y="269" width="150" height="7" rx="2.5" fill="#e3e1da"/>
    <rect x="432" y="269" width="38" height="7" rx="2.5" fill="#175e55" opacity="0.45"/>

    <rect x="196" y="282" width="40" height="7" rx="2.5" fill="#c9cfc9"/>
    <rect x="244" y="282" width="168" height="7" rx="2.5" fill="#e3e1da"/>
    <rect x="432" y="282" width="38" height="7" rx="2.5" fill="#175e55" opacity="0.45"/>
  </g>

  <!-- PEOPLE section -->
  <text x="196" y="316" font-size="8" letter-spacing="1.4" fill="#5f6d68" font-weight="700">PEOPLE</text>
  <g>
    <circle cx="204" cy="332" r="8" fill="#e7f0ec"/>
    <rect x="220" y="325" width="92" height="7" rx="2.5" fill="#c9cfc9"/>
    <rect x="220" y="336" width="64" height="6" rx="2" fill="#e3e1da"/>

    <circle cx="204" cy="358" r="8" fill="#e7f0ec"/>
    <rect x="220" y="351" width="104" height="7" rx="2.5" fill="#c9cfc9"/>
    <rect x="220" y="362" width="58" height="6" rx="2" fill="#e3e1da"/>
  </g>

  <!-- verified footer strip -->
  <g>
    <rect x="196" y="386" width="274" height="22" rx="6" fill="#f3f6f3"/>
    <circle cx="209" cy="397" r="5" fill="#175e55"/>
    <path d="M206.5 397 l2 2 l4 -4" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="400" font-size="7.5" fill="#5f6d68">Every fact linked to its public source</text>
  </g>

  <!-- magnifier, examining the program text -->
  <g transform="rotate(12 452 205)">
    <circle cx="452" cy="199" r="34" fill="#fbfaf8" fill-opacity="0.35" stroke="#175e55" stroke-width="7"/>
    <line x1="452" y1="240" x2="452" y2="287" stroke="#175e55" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
</body>
